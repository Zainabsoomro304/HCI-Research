# Every analysis constant and seed lives here. Changing this file changes the config hash in every manifest.

study:
  # One group of participants: Session 1 (comparisons), then Session 2 (shopping). Codes P-001, P-002, ...
  # The number of participants is not fixed. With fewer than small_n_threshold eligible participants, RQ2 and RQ3 are
  # reported as exploratory and RQ4 (H4b) as estimation first, with the TOST secondary.
  small_n_threshold: 32
  comparison_session_types: [comparison]
  # Participants flagged protocol = earlier-version: analysed in the primary analysis, with a sensitivity analysis
  # without them (set to false to leave them out of the primary analysis instead).
  include_earlier_protocol: true

seeds:
  simulate: 1
  cv_folds: 11
  clustering: 21
  learning_curve: 31
  bootstrap: 41
  mlp: 51
  power: 61

cleaning:
  drop_practice: true
  require_completed_session: true
  fast_rt_ms: 300
  exclude_fast_rt: false
  fatigue_half_boundary: 40           # trials 1-40 = first half, matching the platform's floor(80 / 2)

model:
  # Linear busyness is removed: numChangedSettings is the exact sum of the 8 dummies, so a linear term cannot be
  # separated from w. "auto" adds the curvature term (busy - 3)^2 only if the design supports it.
  curvature: auto                     # auto | on | off
  curvature_max_vif: 10.0
  sigma_grid: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0]
  sigma_cv_folds: 5
  min_people_for_sigma_cv: 4           # with fewer others, fallback_sigma is used
  fallback_sigma: 2.0
  sigma_pool: 10.0                    # weak prior for pooled (global and cluster) fits
  nuisance_sigma: 2.0                 # person-level prior while estimating the nuisance terms
  nuisance_rounds: 6

targets:
  # Adaptive targets are restricted to the range of changes participants saw in the clips.
  min_changed: 2
  max_changed: 4

clusters:
  candidates: [2, 3]
  kmeans_n_init: 20
  min_cluster_size: 6                 # a cluster count is allowed only if every cluster has this many people (else 1 cluster)

preferences:
  k_values: [5, 10, 20, 30, 50]
  n_test: 20
  n_splits: 10
  ceiling_fraction: 0.9               # k90: the smallest k reaching this share of the ceiling
  bootstrap_samples: 2000
  cluster_stability_samples: 200
  sigma_inner_folds: 4                # sigma is tuned inside the others, with this many folds of participants
  n_jobs: -1
  r_workers: 6
  slopes_sensitivity: true            # also fit (start | participant) per split
  gamma_grid: [-0.5, -0.25, -0.1, 0.1, 0.25, 0.5]   # how far targets move if w contains this much busyness bias
  mlp:                                # secondary model: one robustness table only
    hidden: [16]
    alpha: 1.0
    max_iter: 500

evaluation:
  primary_outcome: sus                # H4a and H4b: SUS (Brooke 1996), 0-100
  secondary_outcomes: [seq]           # SEQ (Sauro & Dumas 2009), 1-7; plus log task time and task success
  # H4b margin in SUS points: about 0.4 SD, with SD about 12 (Anam, Sadiq & Jamil 2020, Urdu SUS). Fixed before any
  # shopping-session data exist.
  equivalence_margin: 5.0
  sus_sd: 12.0

power:
  simulations: 5000
  sds: [12.0]                         # SUS SD (Anam, Sadiq & Jamil 2020)
  correlations: [0.5, 0.6, 0.7]       # between a person's SUS in two conditions: unknown, so a range
  true_differences: [0.0]
  sample_sizes: [16, 32, 48, 64]
  highlight_n: [16, 32, 48, 64]

plans:
  trigger_after_ms: 8000

simulate:
  urdu_share: 0.5                     # share of participants doing the study in Urdu
  age_min: 40                         # eligibility: 40 and over
  age_max: 78
  cluster_probs: [0.34, 0.33, 0.33]
  # Weights in logit units. Feature order: textSize.large textSize.xlarge targetSize.large buttonStyle.outlined
  # buttonStyle.raised iconLabels.iconText contrast.high layout.grid2 layout.list guidance.hints.
  # Plausible older-adult profiles (mirrors src/config/simulation.ts): (1) wants larger text, bigger targets, labels and
  # high contrast; (2) likes the standard look but values labels and roomier layouts; (3) wants larger text and labels,
  # dislikes the list layout and hints.
  cluster_means:
    - [1.2, 1.6, 1.0, 0.6, 1.0, 1.0, 0.8, 0.4, 0.8, 0.8]
    - [0.5, -0.4, 0.3, 0.3, 0.6, -0.5, -0.3, 0.5, -0.6, -0.8]
    - [0.8, 0.4, 0.6, 0.9, 0.4, 0.6, 0.2, -0.6, -1.2, 0.3]
  weight_scale: 2.0
  individual_sd: 1.0
  decisiveness_log_sd: 0.5            # person-level multiplier on all weights: how strong their preferences are
  side_bias: 0.2
  busy_gamma: -0.1                    # linear busyness: only w + gamma is recoverable
  busy_curvature: 0.0
  lapse_min: 0.0
  lapse_max: 0.08
  fatigue_lapse_slope: 0.03           # added lapse rate at the end of the session
  questionnaire_informativeness: 0.6
  questionnaire_no_preference: 0.15
  rt_median_ms: 1800
  rt_log_sd: 0.6
  incomplete_participants: 0
  shopping:                           # mirrors SIMULATION.shopping in src/config/simulation.ts
    scenario: equivalence             # equivalence | cluster5_worse
    scenarios:
      equivalence: {cluster5_shift: 0.0}
      cluster5_worse: {cluster5_shift: -8.0}   # SUS points
    plan_sigma: 2.0
    sus_mean: 68.0                    # latent SUS per task, 0-100
    sus_per_utility: 1.0
    participant_sd: 8.0
    residual_sd: 7.0
    position_effect: -0.5
    task_sd: 1.0
    item_noise_sd: 0.6
    seq_noise_sd: 0.8
    time_median_s: 180
    time_log_sd: 0.3
    time_per_sus: -0.005
    success_logit: 1.5
    success_per_sus: 0.04
    within_budget_rate: 0.9
    rank_noise_sd: 8.0
