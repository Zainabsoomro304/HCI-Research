    "PlackettLuce": {
      "Package": "PlackettLuce",
      "Version": "0.4.3",
      "Source": "Repository",
      "Type": "Package",
      "Title": "Plackett-Luce Models for Rankings",
      "Authors@R": "c(person(\"Heather\", \"Turner\", email = \"ht@heatherturner.net\", role = c(\"aut\", \"cre\"), comment = c(ORCID = \"0000-0002-1256-3375\")), person(\"Ioannis\", \"Kosmidis\", role = \"aut\", comment = c(ORCID = \"0000-0003-1556-0302\")), person(\"David\", \"Firth\", role = \"aut\", comment = c(ORCID = \"0000-0003-0302-2312\")), person(\"Jacob\", \"van Etten\", role = \"ctb\", comment = c(ORCID = \"0000-0001-7554-2558\")))",
